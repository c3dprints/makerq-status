<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Status</title>
<style>
  body{margin:0;background:#0b1623;color:#ddeeff;font-family:Arial,Helvetica,sans-serif;padding:24px}
  .wrap{max-width:640px;margin:auto}
  .card{background:#162236;border:1px solid #1e3550;border-radius:16px;padding:22px;margin-bottom:14px}
  h1{color:#33ccff;margin:0}
  h2{color:#33ccff;margin:0 0 6px}
  h3{color:#ff8c3a;margin:0 0 8px}
  .badge{display:inline-block;border:1px solid #1e3550;border-radius:999px;padding:6px 12px;color:#33ccff;font-weight:bold}
  .price{font-size:28px;color:#00e890;font-weight:bold;margin:12px 0}
  .note{background:rgba(255,140,58,.08);border:1px solid rgba(255,140,58,.35);border-radius:12px;padding:12px;color:#ff8c3a;margin-top:10px}
  .step{padding:12px 14px;margin:8px 0;border:1px solid #1e3550;border-radius:12px;background:#0d1928;color:#8aa8c5}
  .step.done{color:#00e890}
  .muted{color:#7fa0bd;text-align:center;font-size:12px;margin-top:14px}
  img.logo{max-width:160px;max-height:90px;height:auto}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="card"><h2>Loading your order status…</h2></div>
</div>
<script>
// MakerQ shared status service (Supabase Edge Function that returns JSON).
var API = "https://enyimtvgqzmpaiaeiyxj.supabase.co/functions/v1/dynamic-endpoint";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})}
function token(){ // support #token, ?token=, #token=
  var h=(location.hash||"").replace(/^#/,"");
  if(h.indexOf("token=")===0) h=h.slice(6);
  if(h) return decodeURIComponent(h);
  var p=new URLSearchParams(location.search); return p.get("token")||"";
}
function render(d){
  var root=document.getElementById("root");
  if(!d||!d.found){root.innerHTML='<div class="card"><h1 style="color:#33ccff">Order not found</h1><p>This status link is no longer available.</p></div>';return}
  var name=esc(d.shop_name||"Your shop");
  var logo=String(d.logo_url||"");
  var logoHtml=logo.indexOf("http")===0?'<img class="logo" src="'+esc(logo)+'" alt="'+name+'">':'<h1 style="color:#33ccff;margin:0">'+name+'</h1>';
  var steps=["Quote Sent","Approved","Payment Received","Printing","Completed"];
  var order=["Quoted","Approved","Awaiting Payment","Printing","Completed"];
  var cur=String(d.status||"New"), idx=order.indexOf(cur);
  var stepHtml=steps.map(function(s,i){var done=idx>=0&&i<=idx;return '<div class="step'+(done?' done':'')+'">'+(done?'✓':'○')+' <strong>'+esc(s)+'</strong></div>'}).join("");
  root.innerHTML=
    '<div style="text-align:center;margin-bottom:12px">'+logoHtml+'</div>'+
    '<div class="card"><h2>Order Status</h2><div class="badge">'+esc(cur)+'</div>'+
    '<div class="price">'+esc(d.price_text||"")+'</div>'+
    (d.note?'<div class="note">'+esc(d.note)+'</div>':'')+'</div>'+
    '<div class="card"><h3>Progress</h3>'+stepHtml+'</div>'+
    '<p class="muted">Powered by MakerQ</p>';
  document.title=(d.shop_name||"Order")+" — Order Status";
}
(function(){
  var t=token();
  if(!t){render({found:false});return}
  fetch(API+"?token="+encodeURIComponent(t)).then(function(r){return r.json()}).then(render).catch(function(){render({found:false})});
})();
</script>
</body>
</html>
